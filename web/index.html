<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBRAS no Navegador</title>
<style>
  /* Página escura, para combinar com o HUD (mesmo visual da janela do app desktop) */
  :root { --bg: #0b0c0e; --card: #121417; --ink: #f5f5f5; --muted: #9ba0a5; --line: #2a3037; --accent: #00e5ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 16px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { display: none; }
  .stage:fullscreen { border-radius: 0; aspect-ratio: auto; }
  .stage:fullscreen canvas { object-fit: contain; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; text-align: center; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  button.primary { background: #00a8bd; color: #001014; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); }
  input[type=range] { width: 160px; vertical-align: middle; accent-color: var(--accent); }
  .stats { color: var(--muted); font-size: 13px; margin-top: 10px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Alfabeto Manual de LIBRAS</h1>
  <p class="sub">Reconhecimento em tempo real rodando inteiramente no seu navegador. O vídeo não sai do seu computador.</p>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="placeholder" id="placeholder">Carregando modelo…</div>
  </div>

  <div class="row">
    <button class="primary" id="btnStart" disabled>Iniciar câmera</button>
    <button id="btnSpace">Espaço</button>
    <button id="btnDel">Apagar</button>
    <button id="btnClear">Limpar</button>
    <button id="btnSpeak">Falar (Enter)</button>
    <button id="btnVoice">Modo de voz (V)</button>
    <button id="btnHelp">Manual de atalhos (H)</button>
    <button id="btnFull">Tela cheia</button>
    <label for="thr" style="margin-left:8px">Limiar:</label>
    <input type="range" id="thr" min="20" max="95" step="5" value="50">
  </div>
  <div class="stats" id="stats"></div>
</main>

<script type="module">
import { FilesetResolver, GestureRecognizer }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

// Mesmos parâmetros e o mesmo HUD do app desktop (src/desktop/detectar_libras.py)
// No Hugging Face Space estático só a pasta web/ é servida, então o modelo vem do endpoint "resolve" do repositório
const MODEL_URL = location.hostname.endsWith(".hf.space")
  ? "https://huggingface.co/spaces/RubensMota13/LibrasMediaPipe/resolve/main/models/gesture_recognizer.task"
  : "../models/gesture_recognizer.task"; // servido a partir da raiz do repositório
const LETTER_DELAY_MS = 700;       // intervalo mínimo entre letras
const HOLD_MS = 1000;              // a letra precisa ficar estável por esse tempo para entrar na legenda
const LEGEND_CLEAR_MS = 5000;      // modo automático: fala e limpa após esse tempo sem novos sinais
let threshold = 0.50;
let autoSpeak = false;             // false = manual (Enter), true = automático (pausa de 5 s)
let showHelp = false;              // manual de atalhos aberto (pausa a digitação)

// Tela em HD (1280x720), como a janela do desktop
const W = 1280, H = 720;

// Paleta do desktop (lá em BGR, aqui convertida para RGB)
const C = {
  emerald: "#00e676", amber: "#ff9100", silver: "#cfd8dc", cyan: "#00e5ff",
  gold: "#ffd700", yellow: "#ffee55", white: "#f5f5f5", muted: "#9ba0a5",
  bar: "rgb(15,18,20)", barLine: "rgb(42,48,55)",
};
// Fontes do desktop: Segoe UI 30/22 negrito, 18/16 normal
const FAMILY = '"Segoe UI", "Segoe UI Variable", system-ui, Arial, sans-serif';
const F = {
  largeBold: `bold 30px ${FAMILY}`, medBold: `bold 22px ${FAMILY}`,
  med: `18px ${FAMILY}`, small: `16px ${FAMILY}`,
};
const CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],        // Polegar
  [0, 5], [5, 6], [6, 7], [7, 8],        // Indicador
  [0, 9], [9, 10], [10, 11], [11, 12],   // Médio
  [0, 13], [13, 14], [14, 15], [15, 16], // Anelar
  [0, 17], [17, 18], [18, 19], [19, 20], // Mínimo
];
const SHORTCUTS = [
  ["[Enter]", "Falar legenda acumulada (voz) e limpar texto"],
  ["[V]", "Alternar modo de voz (Manual <\u200c-\u200c> Automático)"],
  ["[+] / [=]", "Aumentar limiar de confiança (+5%)"],
  ["[-] / [_]", "Diminuir limiar de confiança (-5%)"],
  ["[C]", "Limpar a legenda acumulada"],
  ["[D/Backsp]", "Apagar o último caractere digitado"],
  ["[Espaço]", "Inserir um espaço entre palavras"],
  ["[H]", "Abrir / fechar este manual de atalhos"],
  ["[Q]", "Parar a câmera"],
];

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d"), statsEl = $("stats");
// Quadro espelhado na resolução da câmera: é ele que o modelo recebe, sem o HUD por cima
const frameCanvas = document.createElement("canvas"), fctx = frameCanvas.getContext("2d");

let recognizer, delegate;
let text = "", lastSeen = null, lastCommit = 0, lastUpdate = 0, stream = null;
let cand = null, candStart = 0, doneLetter = null, doneUntil = 0; // letra sendo confirmada (barra de progresso)
let lastVideoTime = -1, frames = 0, fpsT0 = performance.now(), inferMs = 0, fps = 0;

async function createRecognizer() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
  for (const d of ["GPU", "CPU"]) {
    try {
      recognizer = await GestureRecognizer.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: d },
        runningMode: "VIDEO",
        numHands: 1,
      });
      delegate = d;
      return;
    } catch (e) {
      console.warn(`Falha ao criar com delegate ${d}:`, e);
    }
  }
  throw new Error("Não foi possível carregar o modelo.");
}

// Mesma lógica de update_recognized_text do desktop (letras entram em minúsculas, como lá)
function updateText(token, now) {
  if (!token) { lastSeen = null; return; }
  const t = token.trim().toLowerCase();
  if (!t || t === lastSeen) return;
  let changed = false;
  if (["space", "espaco", "espaço"].includes(t)) {
    if (text && !text.endsWith(" ")) { text += " "; changed = true; }
  } else if (["del", "delete", "apagar", "backspace"].includes(t)) {
    changed = text.length > 0;
    text = text.slice(0, -1);
  } else if (t.length === 1 && /[a-z]/.test(t)) {
    if (now - lastCommit < LETTER_DELAY_MS) return; // não trava a letra: tenta de novo no próximo frame
    text += t;
    lastCommit = now;
    changed = true;
  }
  lastSeen = t;
  if (changed) lastUpdate = now;
}

function resetText() { text = ""; lastSeen = null; lastUpdate = 0; cand = null; }

// Só passa a letra para a legenda depois de ela ficar HOLD_MS seguidos acima do limiar.
// Devolve o progresso (0 a 1) para a barra.
function holdLetter(token, now) {
  const t = token.trim().toLowerCase();
  if (t === lastSeen) { cand = null; return 0; } // já entrou: troque de letra ou abaixe a mão para repetir
  if (t !== cand) { cand = t; candStart = now; }
  const p = Math.min(1, (now - candStart) / HOLD_MS);
  if (p >= 1) {
    updateText(token, now);
    if (lastSeen === t) { doneLetter = t; doneUntil = now + 400; cand = null; }
  }
  return p;
}

function setThreshold(v) {
  threshold = Math.min(0.95, Math.max(0.20, Math.round(v * 100) / 100));
  $("thr").value = Math.round(threshold * 100);
}

function toggleHelp(open = !showHelp) { showHelp = open; }

function speakAndClear() {
  if (!text.trim()) return;
  speak(text);
  resetText();
}

function stopCamera() {
  if (!stream) return;
  stream.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
  $("placeholder").textContent = "Câmera parada. Clique em “Iniciar câmera”.";
  $("placeholder").style.display = "";
  $("btnStart").disabled = false;
}

function speak(s) {
  if (!s.trim() || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(s.toLowerCase());
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

// ---------- Desenho do HUD (mesmas posições, cores e textos do desktop) ----------
function txt(s, x, y, font, color, align = "left") {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "top";
  ctx.fillText(s, x, y);
}

function drawHand(lm) {
  // Pontos verdes (raio 6) e depois as ligações azuis (espessura 3), na mesma ordem do desktop
  ctx.fillStyle = "#00ff00";
  for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 6, 0, 2 * Math.PI); ctx.fill(); }
  ctx.strokeStyle = "#0000ff"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [a, b] of CONNECTIONS) { ctx.moveTo(lm[a].x * W, lm[a].y * H); ctx.lineTo(lm[b].x * W, lm[b].y * H); }
  ctx.stroke();
}

// Barra de progresso acima da mão: enche enquanto a mesma letra continua estável
function drawProgress(lm, progress, now) {
  const done = doneLetter && now < doneUntil;
  if (!cand && !done) return;
  const xs = lm.map((p) => p.x * W), ys = lm.map((p) => p.y * H);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const bw = Math.max(230, x1 - x0), bh = 14;
  const bx = Math.min(W - bw - 10, Math.max(10, (x0 + x1) / 2 - bw / 2));
  const by = Math.max(76 + 52, Math.min(...ys) - 30);
  const letter = (done ? doneLetter : cand).toUpperCase();
  const p = done ? 1 : progress, color = done ? C.emerald : C.cyan;
  ctx.fillStyle = "rgba(15,18,20,0.80)"; // painel escuro para o texto aparecer sobre qualquer fundo
  ctx.beginPath(); ctx.roundRect(bx - 12, by - 40, bw + 24, bh + 52, 10); ctx.fill();
  txt(done ? `${letter} adicionada` : `Reconhecendo ${letter}...`, bx, by - 32, F.medBold, color);
  ctx.fillStyle = "rgb(42,48,55)";
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(bx, by, Math.max(bh, bw * p), bh, bh / 2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.stroke();
}

function drawTopBar(gesture) {
  const barH = 76;
  ctx.fillStyle = C.bar; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = C.barLine; ctx.fillRect(0, barH, W, 1);
  const thr = Math.round(threshold * 100);
  let label = "Sinal: sem gesto", color = C.silver;
  if (gesture) {
    const pct = (gesture.score * 100).toFixed(1);
    if (gesture.score >= threshold) { label = `Sinal: ${gesture.name} (${pct}%) [OK]`; color = C.emerald; }
    else { label = `Sinal: ${gesture.name} (${pct}%) [< ${thr}%]`; color = C.amber; }
  }
  txt(label, 20, 10, F.medBold, color);
  txt(`Limiar: ${thr}% [+/-]`, W - 20, 10, F.medBold, C.cyan, "right");
  txt(showHelp ? "MODO AJUDA ABERTO" : "Reconhecimento ativo  |  Modelo: MediaPipe .task", 20, 44, F.small, C.muted);
  txt("[H] Manual de Atalhos  |  [C] Limpar  |  [Q] Sair", W - 20, 44, F.small, C.white, "right");
}

function drawBottomBar() {
  const barH = 86, y0 = H - barH;
  ctx.fillStyle = C.bar; ctx.fillRect(0, y0, W, barH);
  ctx.fillStyle = C.barLine; ctx.fillRect(0, y0, W, 1);
  const voice = autoSpeak
    ? [`Voz: [AUTO - fala em ${LEGEND_CLEAR_MS / 1000}s]  (tecle V p/ Manual)`, C.cyan]
    : ["Voz: [MANUAL - tecle Enter p/ falar]  (tecle V p/ Auto)", C.gold];
  txt(voice[0], 20, y0 + 10, F.small, voice[1]);
  txt("[D/Backsp] Apagar letra  |  [Espaço] Espaço", W - 20, y0 + 10, F.small, C.muted, "right");
  txt("Legenda:", 20, y0 + 42, F.largeBold, C.cyan);
  ctx.font = F.largeBold;
  const off = 20 + ctx.measureText("Legenda: ").width;
  if (text) txt(text, off, y0 + 42, F.largeBold, C.yellow);
  else txt("(aguardando sinal...)", off, y0 + 46, F.med, C.muted);
}

function drawHelpModal() {
  ctx.fillStyle = "rgba(18,14,12,0.80)"; ctx.fillRect(0, 0, W, H);
  const mw = Math.min(740, Math.floor(W * 0.90)), mh = Math.min(490, Math.floor(H * 0.88));
  const x1 = Math.floor((W - mw) / 2), y1 = Math.floor((H - mh) / 2);
  ctx.fillStyle = "rgb(18,20,24)"; ctx.fillRect(x1, y1, mw, mh);
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.strokeRect(x1, y1, mw, mh);
  ctx.strokeStyle = "rgb(46,52,60)"; ctx.lineWidth = 1; ctx.strokeRect(x1 + 3.5, y1 + 3.5, mw - 7, mh - 7);
  ctx.fillStyle = "rgb(60,65,70)";
  ctx.fillRect(x1 + 20, y1 + 52, mw - 40, 1);
  ctx.fillRect(x1 + 20, y1 + mh - 42, mw - 40, 1);
  txt("MANUAL DE ATALHOS - LIBRAS", x1 + mw / 2, y1 + 12, F.largeBold, C.cyan, "center");
  const spacing = Math.max(28, Math.floor((mh - 130) / SHORTCUTS.length));
  SHORTCUTS.forEach(([k, d], i) => {
    const cy = y1 + 68 + i * spacing;
    txt(k, x1 + 28, cy, F.medBold, C.gold);
    txt(`: ${d}`, x1 + 160, cy, F.med, C.white);
  });
  txt("Pressione [H] ou [ESC] para retornar ao vídeo", x1 + mw / 2, y1 + mh - 32, F.small, C.muted, "center");
}

function loop() {
  const now = performance.now();
  // Só processa quando a câmera entregou um frame novo
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;

    // Espelha como no desktop (cv2.flip): o modelo vê a mesma orientação do treino/uso local
    fctx.save();
    fctx.translate(frameCanvas.width, 0);
    fctx.scale(-1, 1);
    fctx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
    fctx.restore();

    const t0 = performance.now();
    const result = recognizer.recognizeForVideo(frameCanvas, now);
    inferMs = inferMs * 0.9 + (performance.now() - t0) * 0.1;

    // Quadro redimensionado para 1280x720, como o cv2.resize do desktop
    ctx.drawImage(frameCanvas, 0, 0, W, H);
    const hands = result.landmarks ?? [];
    hands.forEach(drawHand);

    let gesture = null, progress = 0;
    if (!hands.length) lastSeen = null;
    const top = result.gestures?.[0]?.[0];
    if (top && !showHelp) {
      if (top.categoryName && top.categoryName.toLowerCase() !== "none") {
        gesture = { name: top.categoryName, score: top.score };
        if (top.score >= threshold) progress = holdLetter(top.categoryName, now);
        else cand = null;
      } else {
        lastSeen = null; // posição neutra da mão
        cand = null;
      }
    } else {
      cand = null;
    }
    if (hands.length && !showHelp) drawProgress(hands[0], progress, now);

    // Modo automático: fala e limpa a legenda após 5 s sem novos sinais (como no desktop)
    if (autoSpeak && text && lastUpdate && now - lastUpdate >= LEGEND_CLEAR_MS) speakAndClear();

    drawTopBar(gesture);
    drawBottomBar();
    if (showHelp) drawHelpModal();
    frames++;
  }
  if (!stream) return; // câmera parada (Q)
  if (now - fpsT0 >= 500) {
    fps = frames * 1000 / (now - fpsT0);
    statsEl.textContent = `${fps.toFixed(0)} FPS · inferência: ${inferMs.toFixed(1)} ms/frame · aceleração: ${delegate} · câmera ${frameCanvas.width}×${frameCanvas.height}`;
    frames = 0; fpsT0 = now;
  }
  requestAnimationFrame(loop);
}

async function startCamera() {
  $("btnStart").disabled = true;
  try {
    // Pede HD como o desktop; se a câmera não suportar, o navegador entrega a maior resolução possível
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await video.play();
    frameCanvas.width = video.videoWidth || 1280;
    frameCanvas.height = video.videoHeight || 720;
    $("placeholder").style.display = "none";
    requestAnimationFrame(loop);
  } catch (e) {
    $("placeholder").textContent = "Não foi possível acessar a câmera: " + e.message;
    $("btnStart").disabled = false;
  }
}

$("btnStart").onclick = startCamera;
$("btnSpace").onclick = () => { if (text && !text.endsWith(" ")) { text += " "; lastUpdate = performance.now(); } };
$("btnDel").onclick = () => { if (text) { text = text.slice(0, -1); lastSeen = null; lastUpdate = performance.now(); } };
$("btnClear").onclick = resetText;
$("btnSpeak").onclick = speakAndClear;
$("btnVoice").onclick = () => { autoSpeak = !autoSpeak; };
$("btnHelp").onclick = () => toggleHelp();
$("btnFull").onclick = () => { const s = $("stage"); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.(); };
$("thr").oninput = (e) => setThreshold(e.target.value / 100);

// Mesmos atalhos de teclado do app desktop
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "h") { toggleHelp(); return; }
  if (k === "escape") { if (showHelp) toggleHelp(false); return; }
  if (showHelp) return;
  if (e.target.type === "range" && k.startsWith("arrow")) return;
  if (k === " ") { e.preventDefault(); $("btnSpace").click(); }
  else if (k === "backspace" || k === "d") { e.preventDefault(); $("btnDel").click(); }
  else if (k === "c") $("btnClear").click();
  else if (k === "enter") { e.preventDefault(); speakAndClear(); }
  else if (k === "v") $("btnVoice").click();
  else if (k === "+" || k === "=") setThreshold(threshold + 0.05);
  else if (k === "-" || k === "_") setThreshold(threshold - 0.05);
  else if (k === "q") stopCamera();
});

try {
  await createRecognizer();
  $("placeholder").textContent = "Modelo pronto. Clique em “Iniciar câmera”.";
  $("btnStart").disabled = false;
  window.__ready = delegate; // usado nos testes automatizados
} catch (e) {
  $("placeholder").textContent = e.message;
}
</script>
</body>
</html>
