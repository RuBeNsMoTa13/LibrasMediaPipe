<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBRAS no Navegador</title>
<style>
  /* Página escura, para combinar com o HUD (mesmo visual da janela do app desktop) */
  :root { --bg: #0b0c0e; --card: #121417; --ink: #f5f5f5; --muted: #9ba0a5; --line: #2a3037; --accent: #38bdf8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 16px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { display: none; }
  .stage:fullscreen { border-radius: 0; aspect-ratio: auto; }
  .stage:fullscreen canvas { object-fit: contain; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; text-align: center; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  button.primary { background: #38bdf8; color: #0b0d10; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 14px; }
  .stage canvas { cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Alfabeto Manual de LIBRAS</h1>
  <p class="sub">Reconhecimento em tempo real rodando inteiramente no seu navegador. O vídeo não sai do seu computador.</p>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="placeholder" id="placeholder">Carregando modelo…</div>
  </div>

  <div class="row">
    <button class="primary" id="btnStart" disabled>Iniciar câmera</button>
    <span class="hint">Use os botões em cima do vídeo ou o teclado. A tecla H mostra os atalhos.</span>
  </div>
</main>

<script type="module">
import { FilesetResolver, GestureRecognizer }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

// Mesmos parâmetros e o mesmo HUD do app desktop (src/desktop/detectar_libras.py e src/desktop/hud.py)
// No Hugging Face Space estático só a pasta web/ é servida, então o modelo vem do endpoint "resolve" do repositório
const MODEL_URL = location.hostname.endsWith(".hf.space")
  ? "https://huggingface.co/spaces/RubensMota13/LibrasMediaPipe/resolve/main/models/gesture_recognizer.task"
  : "../models/gesture_recognizer.task"; // servido a partir da raiz do repositório
const LETTER_DELAY_MS = 700;       // intervalo mínimo entre letras
const HOLD_MS = 1000;              // a letra precisa ficar estável por esse tempo para entrar na legenda
const LEGEND_CLEAR_MS = 5000;      // modo automático: fala e limpa após esse tempo sem novos sinais
const HISTORY_MAX = 50;            // frases guardadas no histórico
const MAX_HIST_ROWS = 5;           // o cartão do histórico para de crescer aqui e passa a rolar
let threshold = 0.50;
let autoSpeak = false;             // false = manual (Enter), true = automático (pausa de 5 s)
let showHelp = false;              // manual de atalhos aberto (pausa a digitação)
let showHistory = true;            // histórico de frases no canto (tecla T)
let history = [];                  // [{ text, hour }], a mais nova primeiro
let histScroll = 0;

// Tela em HD (1280x720), como a janela do desktop
const W = 1280, H = 720, M = 14;

// Mesma paleta do desktop (hud.py)
const C = {
  accent: "#38bdf8", green: "#34d399", amber: "#fbbf24", text: "#f2f4f7", soft: "#c3cad3",
  muted: "#9aa3ae", panel: "rgba(12,14,18,0.65)", button: "rgba(255,255,255,0.12)",
  track: "rgba(255,255,255,0.18)", line: "rgba(255,255,255,0.10)", dark: "#0b0d10", modal: "#14171c",
};
const FAMILY = '"Segoe UI", "Segoe UI Variable", system-ui, Arial, sans-serif';
const font = (size, bold = false) => `${bold ? "bold " : ""}${size}px ${FAMILY}`;
const CONNECTIONS = [
  [0, 1], [1, 2], [2, 3], [3, 4],        // Polegar
  [0, 5], [5, 6], [6, 7], [7, 8],        // Indicador
  [0, 9], [9, 10], [10, 11], [11, 12],   // Médio
  [0, 13], [13, 14], [14, 15], [15, 16], // Anelar
  [0, 17], [17, 18], [18, 19], [19, 20], // Mínimo
];
const SHORTCUTS = [
  ["Enter", "Falar a frase e guardar no histórico"],
  ["V", "Voz manual ou automática (fala após 5 s)"],
  ["+ / −", "Aumentar ou diminuir o limiar (5%)"],
  ["Espaço", "Inserir espaço entre palavras"],
  ["D / Backspace", "Apagar a última letra"],
  ["C", "Limpar a frase"],
  ["Tab", "Aceitar a correção sugerida"],
  ["A", "Ligar ou desligar o corretor automático"],
  ["T", "Mostrar ou esconder o histórico"],
  ["F", "Tela cheia"],
  ["H / Esc", "Abrir ou fechar este manual"],
  ["Q", "Parar a câmera"],
];
// Ícones (grade 24x24, os mesmos traços do desktop)
const ICONS = {
  speaker: "M11 5 6 9H3v6h3l5 4z M15.5 8.5a5 5 0 0 1 0 7 M18.5 5.5a9 9 0 0 1 0 13",
  space: "M4 10v4h16v-4",
  back: "M21 5H9l-6 7 6 7h12z M17 9l-5 6 M12 9l5 6",
  trash: "M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13",
  chat: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  full: "M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5",
  close: "M6 6l12 12 M18 6 6 18",
};
const ICON_PATHS = Object.fromEntries(Object.entries(ICONS).map(([k, d]) => [k, new Path2D(d)]));

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
// Quadro espelhado na resolução da câmera: é ele que o modelo recebe, sem o HUD por cima
const frameCanvas = document.createElement("canvas"), fctx = frameCanvas.getContext("2d");

let recognizer, delegate;
let text = "", lastSeen = null, lastCommit = 0, lastUpdate = 0, stream = null;
let cand = null, candStart = 0, doneLetter = null, doneUntil = 0; // letra sendo confirmada (barra de progresso)
let lastVideoTime = -1, frames = 0, fpsT0 = performance.now(), inferMs = 0, fps = 0;
let regions = [];                  // áreas clicáveis do último quadro: [nome, x1, y1, x2, y2]

// ---------- Corretor automático (mesmo algoritmo de src/desktop/corretor.py) ----------
// Ao terminar uma palavra (espaço), sugere a palavra do português mais parecida; Tab ou o botão aceita.
let autocorrectOn = true;
let suggestion = null;             // { start, word, fix } esperando Tab
const WORDS = new Map();           // palavra sem acento -> [grafia certa, posição: menor = mais comum]
const MISSING_LETTERS = new Set("hjkxz"); // letras com movimento, fora do alfabeto: faltar uma custa meia edição
const normalize = (w) => w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
fetch("palavras_pt.txt").then((r) => r.ok ? r.text() : Promise.reject(r.status)).then((t) => {
  for (const line of t.split("\n")) {
    const w = line.trim();
    if (w && !w.startsWith("#") && !WORDS.has(normalize(w))) WORDS.set(normalize(w), [w, WORDS.size]);
  }
}).catch((e) => console.warn("Corretor sem lista de palavras:", e));

function editDistance(a, b, limit) {
  let prev2 = null, prev = [0];
  for (const ch of b) prev.push(prev[prev.length - 1] + (MISSING_LETTERS.has(ch) ? 0.5 : 1));
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      const ins = MISSING_LETTERS.has(b[j - 1]) ? 0.5 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + ins, prev[j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev2[j - 2] + 1);
      best = Math.min(best, cur[j]);
    }
    if (best > limit) return limit + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}

function suggest(word) {
  const key = normalize(word);
  if (key.length < 2 || !WORDS.size) return null;
  if (WORDS.has(key)) { const right = WORDS.get(key)[0]; return right !== word.toLowerCase() ? right : null; }
  const limit = key.length <= 4 ? 1 : 2;
  let best = null;
  for (const [other, [right, rank]] of WORDS) {
    if (key.length - other.length > limit || other.length - key.length > 2 * limit) continue;
    const d = editDistance(key, other, limit);
    if (d > limit) continue;
    // menos edições primeiro; entre as parecidas, a mais comum, com preferência pelo mesmo tamanho
    const score = d + 0.12 * Math.log10(rank + 1) + 0.1 * Math.abs(other.length - key.length);
    if (!best || score < best[0]) best = [score, right];
  }
  return best ? best[1] : null;
}

function checkLastWord() {
  const trimmed = text.trimEnd();
  const word = trimmed.split(" ").pop();
  if (!autocorrectOn || !word) return null;
  const fix = suggest(word);
  return fix ? { start: trimmed.length - word.length, word, fix } : null;
}
const suggestionValid = () => suggestion && text.slice(suggestion.start, suggestion.start + suggestion.word.length) === suggestion.word;

function acceptSuggestion() {
  if (suggestionValid()) {
    const { start, word, fix } = suggestion;
    text = text.slice(0, start) + fix + text.slice(start + word.length);
  }
  suggestion = null;
}

async function createRecognizer() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm");
  for (const d of ["GPU", "CPU"]) {
    try {
      recognizer = await GestureRecognizer.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: d },
        runningMode: "VIDEO",
        numHands: 1,
      });
      delegate = d;
      return;
    } catch (e) {
      console.warn(`Falha ao criar com delegate ${d}:`, e);
    }
  }
  throw new Error("Não foi possível carregar o modelo.");
}

// Mesma lógica de update_recognized_text do desktop (letras entram em minúsculas, como lá)
function updateText(token, now) {
  if (!token) { lastSeen = null; return; }
  const t = token.trim().toLowerCase();
  if (!t || t === lastSeen) return;
  let changed = false;
  if (["space", "espaco", "espaço"].includes(t)) {
    if (text && !text.endsWith(" ")) { text += " "; changed = true; suggestion = checkLastWord(); }
  } else if (["del", "delete", "apagar", "backspace"].includes(t)) {
    changed = text.length > 0;
    text = text.slice(0, -1);
  } else if (t.length === 1 && /[a-z]/.test(t)) {
    if (now - lastCommit < LETTER_DELAY_MS) return; // não trava a letra: tenta de novo no próximo frame
    text += t;
    lastCommit = now;
    changed = true;
  }
  lastSeen = t;
  if (changed) lastUpdate = now;
}

function resetText() { text = ""; lastSeen = null; lastUpdate = 0; cand = null; }

// Só passa a letra para a legenda depois de ela ficar HOLD_MS seguidos acima do limiar.
// Devolve o progresso (0 a 1) para a barra.
function holdLetter(token, now) {
  const t = token.trim().toLowerCase();
  if (t === lastSeen) { cand = null; return 0; } // já entrou: troque de letra ou abaixe a mão para repetir
  if (t !== cand) { cand = t; candStart = now; }
  const p = Math.min(1, (now - candStart) / HOLD_MS);
  if (p >= 1) {
    updateText(token, now);
    if (lastSeen === t) { doneLetter = t; doneUntil = now + 400; cand = null; }
  }
  return p;
}

function setThreshold(v) { threshold = Math.min(0.95, Math.max(0.20, Math.round(v * 100) / 100)); }

function toggleHelp(open = !showHelp) { showHelp = open; }

// Fala a frase, guarda no histórico e limpa (Enter, botão Falar ou modo automático)
function speakAndClear() {
  const phrase = text.trim();
  if (!phrase) return;
  speak(phrase);
  const d = new Date();
  history.unshift({ text: phrase, hour: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` });
  history.length = Math.min(history.length, HISTORY_MAX);
  histScroll = 0;
  resetText();
}

function stopCamera() {
  if (!stream) return;
  stream.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
  $("placeholder").textContent = "Câmera parada. Clique em “Iniciar câmera”.";
  $("placeholder").style.display = "";
  $("btnStart").disabled = false;
}

function speak(s) {
  if (!s.trim() || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(s.toLowerCase());
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

function toggleFullscreen() {
  const s = $("stage");
  document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.();
}

// Ações dos atalhos de teclado e dos botões do HUD (as mesmas do desktop)
const ACTIONS = {
  help: () => toggleHelp(),
  speak: speakAndClear,
  voice: () => { autoSpeak = !autoSpeak; },
  "thr+": () => setThreshold(threshold + 0.05),
  "thr-": () => setThreshold(threshold - 0.05),
  clear: resetText,
  del: () => { if (text) { text = text.slice(0, -1); lastSeen = null; lastUpdate = performance.now(); } },
  space: () => { if (text && !text.endsWith(" ")) { text += " "; lastUpdate = performance.now(); suggestion = checkLastWord(); } },
  hist: () => { showHistory = !showHistory; histScroll = 0; },
  full: toggleFullscreen,
  model: () => {}, // na web só existe o .task
  accept: acceptSuggestion,
  dismiss: () => { suggestion = null; },
  autocorrect: () => { autocorrectOn = !autocorrectOn; suggestion = null; },
};

// ---------- Desenho do HUD (mesmo desenho do desktop: src/desktop/hud.py) ----------
function txt(s, x, y, size, color, bold = false, align = "left") {
  ctx.font = font(size, bold); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
const width = (s, size, bold = false) => { ctx.font = font(size, bold); return ctx.measureText(s).width; };
function rrect(x1, y1, x2, y2, r, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x1, y1, x2 - x1, y2 - y1, r); ctx.fill();
}
function icon(name, x, y, size, color, lineWidth = 2) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = lineWidth * 24 / size; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.stroke(ICON_PATHS[name]);
  ctx.restore();
}
function fitTail(s, size, maxW) {
  if (width(s, size) <= maxW) return s;
  while (s && width("…" + s, size) > maxW) s = s.slice(1);
  return "…" + s;
}
function fitHead(s, size, maxW) {
  if (width(s, size) <= maxW) return s;
  while (s && width(s + "…", size) > maxW) s = s.slice(0, -1);
  return s + "…";
}

function drawHand(lm) {
  // Linhas claras e pontos na cor de destaque, como no desktop
  ctx.strokeStyle = "rgb(225,225,225)"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath();
  for (const [a, b] of CONNECTIONS) { ctx.moveTo(lm[a].x * W, lm[a].y * H); ctx.lineTo(lm[b].x * W, lm[b].y * H); }
  ctx.stroke();
  ctx.fillStyle = C.accent;
  for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 5, 0, 2 * Math.PI); ctx.fill(); }
}

function drawSignalCard(gesture, progress, now) {
  const thr = Math.round(threshold * 100);
  let letter = "–", status = "sem gesto", color = C.muted;
  if (gesture) {
    letter = gesture.name.length === 1 ? gesture.name.toUpperCase() : gesture.name;
    const pct = (gesture.score * 100).toFixed(0);
    if (gesture.score >= threshold) { status = `${pct}% · OK`; color = C.green; }
    else { status = `${pct}% · abaixo de ${thr}%`; color = C.amber; }
  }
  const lw = width(letter, 28, true), sw = width(status, 15, true);
  const cw = Math.max(180, 12 + lw + 10 + sw + 14);
  rrect(M, M, M + cw, M + 62, 10, C.panel);
  txt(letter, M + 12, M + 26, 28, C.text, true);
  txt(status, M + 12 + lw + 10, M + 27, 15, color, true);
  const done = doneLetter && now < doneUntil;
  const p = done ? 1 : (cand && !showHelp ? progress : 0);
  const bx1 = M + 12, bx2 = M + cw - 12, by = M + 48;
  rrect(bx1, by, bx2, by + 5, 2.5, C.track);
  if (p > 0) rrect(bx1, by, bx1 + Math.max(5, (bx2 - bx1) * p), by + 5, 2.5, done ? C.green : C.accent);
}

function drawTopButtons() {
  const size = 38;
  ["full", "help", "hist"].forEach((name, i) => {
    const x2 = W - M - i * (size + 6), x1 = x2 - size;
    rrect(x1, M, x2, M + size, 10, C.panel);
    regions.push([name, x1, M, x2, M + size]);
    if (name === "full") icon("full", x1 + 10, M + 10, 18, C.text);
    else if (name === "help") txt("?", x1 + size / 2, M + size / 2 + 1, 18, C.text, true, "center");
    else icon("chat", x1 + 9, M + 9, 20, showHistory ? C.accent : C.text);
  });
}

function drawHistory() {
  const hw = 280, x2 = W - M, x1 = x2 - hw, y1 = M + 38 + 8;
  const n = history.length;
  histScroll = n > MAX_HIST_ROWS ? Math.max(0, Math.min(histScroll, n - MAX_HIST_ROWS)) : 0;
  const visible = history.slice(histScroll, histScroll + MAX_HIST_ROWS);
  const rowH = 44, rowsH = visible.length ? rowH * visible.length : 40, footH = n > MAX_HIST_ROWS ? 26 : 0;
  const y2 = y1 + 32 + rowsH + footH + 6;
  rrect(x1, y1, x2, y2, 14, C.panel);
  regions.push(["histcard", x1, y1, x2, y2]);
  txt("HISTÓRICO", x1 + 14, y1 + 18, 12, C.muted, true);
  txt(`${n} frase${n === 1 ? "" : "s"}`, x2 - 14, y1 + 18, 12, C.muted, false, "right");
  if (!visible.length) txt("As frases faladas aparecem aqui", x1 + 14, y1 + 52, 13, C.muted);
  visible.forEach((item, i) => {
    const ry = y1 + 32 + i * rowH;
    ctx.fillStyle = C.line; ctx.fillRect(x1 + 10, ry, hw - 20, 1);
    txt(fitHead(item.text, 15, hw - 64), x1 + 14, ry + 16, 15, C.text);
    txt(item.hour, x1 + 14, ry + 33, 11, C.muted);
    const rx = x2 - 10 - 32, rby = ry + 6;
    rrect(rx, rby, rx + 32, rby + 32, 8, C.button);
    icon("speaker", rx + 7, rby + 7, 18, C.soft);
    regions.push([`repeat:${histScroll + i}`, rx, rby, rx + 32, rby + 32]);
  });
  if (footH) {
    const fy = y1 + 32 + rowsH;
    ctx.fillStyle = C.line; ctx.fillRect(x1 + 10, fy, hw - 20, 1);
    txt(`${histScroll + 1}–${histScroll + visible.length} de ${n} · role para ver mais`, x1 + 14, fy + 14, 11, C.muted);
  }
}

function drawComposer(progress) {
  const candLetter = cand && !showHelp && cand.length === 1 ? cand : "";
  let shown = text;
  let areaW = 250;
  if (shown || candLetter) {
    shown = fitTail(shown, 22, 520);
    areaW = Math.max(250, width(shown, 22) + width(candLetter, 22) + 4);
  }
  const falarW = 14 + 18 + 7 + width("Falar", 15, true) + 14;
  const total = 18 + areaW + 10 + 3 * 34 + 2 * 6 + 8 + falarW + 7;
  const x1 = Math.round((W - total) / 2), y1 = H - 40 - 50, y2 = H - 40, ym = (y1 + y2) / 2;
  rrect(x1, y1, x1 + total, y2, 14, C.panel);
  const tx = x1 + 18;
  if (!shown && !candLetter) txt("faça um sinal para escrever", tx, ym, 17, C.muted);
  else {
    txt(shown, tx, ym, 22, C.text);
    if (candLetter) {
      const cx = tx + width(shown, 22), cw = Math.max(10, width(candLetter, 22));
      txt(candLetter, cx, ym, 22, C.accent);
      rrect(cx, ym + 13, cx + cw, ym + 16, 1.5, C.track);
      rrect(cx, ym + 13, cx + Math.max(2, cw * progress), ym + 16, 1.5, C.accent);
    }
  }
  let bx = x1 + 18 + areaW + 10;
  for (const [name, ic] of [["space", "space"], ["del", "back"], ["clear", "trash"]]) {
    rrect(bx, y1 + 8, bx + 34, y1 + 42, 8, C.button);
    icon(ic, bx + 8, y1 + 16, 18, C.text);
    regions.push([name, bx, y1 + 8, bx + 34, y1 + 42]);
    bx += 34 + 6;
  }
  const fx = bx - 6 + 8;
  rrect(fx, y1 + 6, fx + falarW, y1 + 44, 10, C.accent);
  icon("speaker", fx + 14, y1 + 16, 18, C.dark);
  txt("Falar", fx + 14 + 18 + 7, ym, 15, C.dark, true);
  regions.push(["speak", fx, y1 + 6, fx + falarW, y1 + 44]);

  // Sugestão do corretor, logo acima da frase
  if (suggestion) {
    const { word, fix } = suggestion;
    const labW = width("corretor", 12, true), typedW = width(word, 16), fixW = width(fix, 17, true);
    const accW = width("Aceitar · Tab", 13, true) + 24;
    const sw = 14 + labW + 12 + typedW + 10 + 16 + 10 + fixW + 14 + accW + 6 + 28 + 6;
    const sx1 = Math.round((W - sw) / 2), sy1 = y1 - 8 - 40, sy2 = y1 - 8, sm = (sy1 + sy2) / 2;
    rrect(sx1, sy1, sx1 + sw, sy2, 12, C.panel);
    let x = sx1 + 14;
    txt("corretor", x, sm, 12, C.muted, true); x += labW + 12;
    txt(word, x, sm, 16, C.soft);
    ctx.fillStyle = C.soft; ctx.fillRect(x, sm, typedW, 1);
    x += typedW + 10;
    ctx.strokeStyle = C.muted; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, sm); ctx.lineTo(x + 16, sm); ctx.moveTo(x + 10, sm - 5); ctx.lineTo(x + 16, sm); ctx.lineTo(x + 10, sm + 5); ctx.stroke();
    x += 16 + 10;
    txt(fix, x, sm, 17, C.accent, true); x += fixW + 14;
    rrect(x, sy1 + 6, x + accW, sy2 - 6, 8, C.accent);
    txt("Aceitar · Tab", x + 12, sm, 13, C.dark, true);
    regions.push(["accept", x, sy1 + 6, x + accW, sy2 - 6]);
    const dx = x + accW + 6;
    rrect(dx, sy1 + 6, dx + 28, sy2 - 6, 8, C.button);
    icon("close", dx + 6, sy1 + 12, 16, C.text);
    regions.push(["dismiss", dx, sy1 + 6, dx + 28, sy2 - 6]);
  }
}

function drawFooter() {
  const y1 = H - 10 - 24, y2 = H - 10, ym = (y1 + y2) / 2;
  let x = M;
  const chip = (label, color = C.soft, region = null, bold = false) => {
    const cw = width(label, 13, bold) + 20;
    rrect(x, y1, x + cw, y2, 7, C.panel);
    txt(label, x + 10, ym, 13, color, bold);
    if (region) regions.push([region, x, y1, x + cw, y2]);
    x += cw + 5;
  };
  chip("modelo .task");
  chip("−", C.text, "thr-", true);
  chip(`limiar ${Math.round(threshold * 100)}%`);
  chip("+", C.text, "thr+", true);
  if (autoSpeak) chip(`voz auto ${LEGEND_CLEAR_MS / 1000} s (V)`, C.accent, "voice");
  else chip("voz manual (V)", C.soft, "voice");
  if (autocorrectOn) chip("corretor ligado (A)", C.accent, "autocorrect");
  else chip("corretor desligado (A)", C.soft, "autocorrect");
  const stats = `${fps.toFixed(0)} FPS · ${inferMs.toFixed(0)} ms · ${delegate}`;
  const sw = width(stats, 13) + 20;
  rrect(W - M - sw, y1, W - M, y2, 7, C.panel);
  txt(stats, W - M - 10, ym, 13, C.soft, false, "right");
}

function drawHelpModal() {
  ctx.fillStyle = "rgba(8,10,13,0.78)"; ctx.fillRect(0, 0, W, H);
  const mw = 600, mh = 84 + SHORTCUTS.length * 32 + 44;
  const x1 = (W - mw) / 2, y1 = (H - mh) / 2, x2 = x1 + mw, y2 = y1 + mh;
  rrect(x1 - 1, y1 - 1, x2 + 1, y2 + 1, 20, "rgba(255,255,255,0.10)");
  rrect(x1, y1, x2, y2, 20, C.modal);
  txt("Atalhos de teclado", x1 + 28, y1 + 38, 24, C.text, true);
  const cx1 = x2 - 24 - 38, cy1 = y1 + 19;
  rrect(cx1, cy1, cx1 + 38, cy1 + 38, 10, C.button);
  icon("close", cx1 + 10, cy1 + 10, 18, C.text);
  SHORTCUTS.forEach(([k, d], i) => {
    const ry = y1 + 84 + i * 32 + 12;
    txt(k, x1 + 28, ry, 16, C.accent, true);
    txt(d, x1 + 28 + 160, ry, 16, C.text);
  });
  txt("O reconhecimento fica pausado enquanto o manual está aberto.", x1 + 28, y2 - 26, 13, C.muted);
  regions = [["modal", x1, y1, x2, y2], ["close_help", cx1, cy1, cx1 + 38, cy1 + 38]];
}

function drawHud(gesture, progress, now) {
  regions = [];
  drawSignalCard(gesture, progress, now);
  drawTopButtons();
  if (showHistory) drawHistory();
  drawComposer(progress);
  drawFooter();
  if (showHelp) drawHelpModal();
}

// Ponto do clique em coordenadas do canvas (1280x720), também em tela cheia (object-fit: contain)
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  const scale = Math.min(r.width / W, r.height / H);
  const ox = r.left + (r.width - W * scale) / 2, oy = r.top + (r.height - H * scale) / 2;
  return [(e.clientX - ox) / scale, (e.clientY - oy) / scale];
}
function hit(x, y) {
  for (let i = regions.length - 1; i >= 0; i--) {
    const [name, x1, y1, x2, y2] = regions[i];
    if (x >= x1 && x <= x2 && y >= y1 && y <= y2) return name;
  }
  return null;
}

function loop() {
  const now = performance.now();
  // Só processa quando a câmera entregou um frame novo
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;

    // Espelha como no desktop (cv2.flip): o modelo vê a mesma orientação do treino/uso local
    fctx.save();
    fctx.translate(frameCanvas.width, 0);
    fctx.scale(-1, 1);
    fctx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
    fctx.restore();

    const t0 = performance.now();
    const result = recognizer.recognizeForVideo(frameCanvas, now);
    inferMs = inferMs * 0.9 + (performance.now() - t0) * 0.1;

    // Quadro redimensionado para 1280x720, como o cv2.resize do desktop
    ctx.drawImage(frameCanvas, 0, 0, W, H);
    const hands = result.landmarks ?? [];
    hands.forEach(drawHand);

    let gesture = null, progress = 0;
    if (!hands.length) lastSeen = null;
    const top = result.gestures?.[0]?.[0];
    if (top && !showHelp) {
      if (top.categoryName && top.categoryName.toLowerCase() !== "none") {
        gesture = { name: top.categoryName, score: top.score };
        if (top.score >= threshold) progress = holdLetter(top.categoryName, now);
        else cand = null;
      } else {
        lastSeen = null; // posição neutra da mão
        cand = null;
      }
    } else {
      cand = null;
    }

    // Modo automático: fala e limpa a legenda após 5 s sem novos sinais (como no desktop)
    if (autoSpeak && text && lastUpdate && now - lastUpdate >= LEGEND_CLEAR_MS) speakAndClear();

    if (!suggestionValid()) suggestion = null; // a palavra foi apagada ou a frase foi falada

    drawHud(gesture, progress, now);
    frames++;
  }
  if (!stream) return; // câmera parada (Q)
  if (now - fpsT0 >= 500) {
    fps = frames * 1000 / (now - fpsT0);
    frames = 0; fpsT0 = now;
  }
  requestAnimationFrame(loop);
}

async function startCamera() {
  $("btnStart").disabled = true;
  try {
    // Pede HD como o desktop; se a câmera não suportar, o navegador entrega a maior resolução possível
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await video.play();
    frameCanvas.width = video.videoWidth || 1280;
    frameCanvas.height = video.videoHeight || 720;
    $("placeholder").style.display = "none";
    requestAnimationFrame(loop);
  } catch (e) {
    $("placeholder").textContent = "Não foi possível acessar a câmera: " + e.message;
    $("btnStart").disabled = false;
  }
}

$("btnStart").onclick = startCamera;

// Cliques nos botões desenhados no vídeo
canvas.addEventListener("click", (e) => {
  const target = hit(...canvasPoint(e));
  if (showHelp) { if (target !== "modal") toggleHelp(false); return; }
  if (!target) return;
  if (target.startsWith("repeat:")) { const item = history[+target.slice(7)]; if (item) speak(item.text); }
  else ACTIONS[target]?.();
});
canvas.addEventListener("mousemove", (e) => {
  const target = hit(...canvasPoint(e));
  canvas.style.cursor = target && target !== "histcard" && target !== "modal" ? "pointer" : "default";
});
// Rolagem do histórico com a roda do mouse
canvas.addEventListener("wheel", (e) => {
  const target = hit(...canvasPoint(e));
  if (!target || !(target === "histcard" || target.startsWith("repeat:"))) return;
  e.preventDefault();
  histScroll = Math.max(0, histScroll + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

// Mesmos atalhos de teclado do app desktop
const KEYS = { enter: "speak", v: "voice", "+": "thr+", "=": "thr+", "-": "thr-", "_": "thr-",
  c: "clear", d: "del", backspace: "del", " ": "space", t: "hist", f: "full", tab: "accept", a: "autocorrect" };
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "h") { toggleHelp(); return; }
  if (k === "escape") { if (showHelp) toggleHelp(false); else suggestion = null; return; }
  if (showHelp) return;
  if (e.target.tagName === "BUTTON" && (k === " " || k === "enter")) return; // deixa o botão Iniciar funcionar
  if (k === "q") { stopCamera(); return; }
  if (KEYS[k]) { e.preventDefault(); ACTIONS[KEYS[k]](); }
});

try {
  await createRecognizer();
  $("placeholder").textContent = "Modelo pronto. Clique em “Iniciar câmera”.";
  $("btnStart").disabled = false;
  window.__ready = delegate; // usado nos testes automatizados
} catch (e) {
  $("placeholder").textContent = e.message;
}
</script>
</body>
